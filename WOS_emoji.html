<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>絵文字入力ヘルパー</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --panel-bg: #f8fafc;
      --key-bg: #f1f5f9;
      --key-hover: #e2e8f0;
      --key-active: #cbd5e1;
      --key-border: #cbd5e1;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.2);
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
    }

    /* 上部操作バー */
    .toolbar {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .mode-switch {
      display: flex;
      background: var(--panel-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--key-border);
      gap: 4px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* キーボード盤面 */
    .keyboard-container {
      width: 100%;
      max-width: 720px;
      background: var(--panel-bg);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--key-border);
      box-shadow: 0 4px 12px -5px rgba(15, 23, 42, 0.2);
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
      gap: 4px;
    }

    /* 各キー */
    .key-btn {
      aspect-ratio: 1;
      background: var(--key-bg);
      border: 1px solid var(--key-border);
      border-bottom: 2px solid #cbd5e1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 3px;
      position: relative;
      transition: all 0.1s ease;
      overflow: hidden;
      outline: none;
    }

    .key-btn:hover:not(:disabled) {
      background: var(--key-hover);
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    .key-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 1px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* disabled 状態 */
    .key-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      filter: grayscale(1);
      transform: none;
      border-bottom-width: 2px;
      box-shadow: none;
    }

    .key-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* トースト通知 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.16), 0 0 8px var(--accent-glow);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
      white-space: nowrap;
      max-width: 90vw;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-code {
      color: var(--accent);
      font-family: monospace;
      font-weight: 700;
      margin: 0 4px;
    }
  </style>
</head>
<body>

  <!-- コピー形式切り替えスイッチ -->
  <div class="toolbar">
    <div class="mode-switch">
      <button class="mode-btn active" id="btnModeTag" onclick="setCopyMode('tag')">タグでコピー</button>
      <button class="mode-btn" id="btnModeChar" onclick="setCopyMode('char')">絵文字でコピー</button>
    </div>
  </div>

  <!-- キーボード盤面 -->
  <div class="keyboard-container">
    <div class="key-grid" id="keyboardGrid"></div>
  </div>

  <!-- コピー通知トースト -->
  <div class="toast" id="toastMessage"></div>

    // 現在のコピーモード ('tag' | 'char')
    let currentMode = 'tag';
    let toastTimeout = null;

    // 仮置き用SVG生成
    function createPlaceholderSvg(code) {
      const hex = code.replace("U+", "");
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
          <rect width="80" height="80" rx="14" fill="#f8fafc"/>
          <rect x="5" y="5" width="70" height="70" rx="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 3"/>
          <circle cx="40" cy="34" r="16" fill="#e2e8f0"/>
          <text x="40" y="39" font-family="monospace" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">${hex}</text>
          <text x="40" y="64" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">ICON</text>
        </svg>
      `.trim();
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    // ボタンの disabled 状態とタイトルを現在のモードに応じて更新
    function updateKeyDisabledStates() {
      const buttons = document.querySelectorAll('.key-btn');
      buttons.forEach(btn => {
        const itemTag = btn.dataset.tag;
        const itemChar = btn.dataset.char;
        const itemCode = btn.dataset.code;
        const isUnknownTag = itemTag === '<?>';

        if (currentMode === 'tag' && isUnknownTag) {
          btn.disabled = true;
          btn.title = `${itemCode}: タグ未定義のためタグコピー不可`;
        } else {
          btn.disabled = false;
          btn.title = currentMode === 'tag' ? `${itemCode} (${itemTag})` : `${itemCode} (${itemChar})`;
        }
      });
    }

    // コピーモードの変更
    function setCopyMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeTag').classList.toggle('active', mode === 'tag');
      document.getElementById('btnModeChar').classList.toggle('active', mode === 'char');
      updateKeyDisabledStates();
    }

    // クリップボードへコピー
    async function copyToClipboard(text, displayLabel) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        showToast(displayLabel);
      } catch (err) {
        showToast('コピーに失敗しました');
      }
    }

    // ふわっと表示するトースト通知
    function showToast(content) {
      const toast = document.getElementById('toastMessage');
      toast.innerHTML = `<span class="toast-code">${escapeHtml(content)}</span> をコピーしました`;
      toast.classList.add('show');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // キーボード盤面のレンダリング
    function renderKeyboard() {
      const grid = document.getElementById('keyboardGrid');
      grid.innerHTML = '';

      EMOJI_LIST.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'key-btn';
        btn.dataset.code = item.code;
        btn.dataset.char = item.char;
        btn.dataset.tag = item.tag;

        // 画像ソースの決定（base64 があれば使用、なければ仮置きSVG）
        let imgSrc = '';
        if (item.base64 && item.base64.trim() !== '') {
          imgSrc = item.base64.startsWith('data:') 
            ? item.base64 
            : `data:image/png;base64,${item.base64}`;
        } else {
          imgSrc = createPlaceholderSvg(item.code);
        }

        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = item.code;
        img.loading = 'lazy';
        btn.appendChild(img);

        // クリック時コピー処理
        btn.addEventListener('click', () => {
          const targetValue = currentMode === 'tag' ? item.tag : item.char;
          copyToClipboard(targetValue, targetValue);
        });

        grid.appendChild(btn);
      });

      // 初期の disabled 状態を反映
      updateKeyDisabledStates();
    }

    // 初期化
    document.addEventListener('DOMContentLoaded', () => {
      renderKeyboard();
    });
  </script>
</body>
</html>
