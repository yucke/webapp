<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行軍同期システム</title>
  <style>
    /* ベーススタイル */
    :root {
      --bg-color: #f3f4f6;
      --text-color: #1f2937;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --waiting-bg: #fef3c7; /* 待機中（オレンジ系） */
      --marching-bg: #dbeafe; /* 行軍中（青系） */
      --arrived-bg: #dcfce7; /* 到着（緑系） */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0; padding: 16px;
    }
    .container {
      max-width: 800px; margin: 0 auto;
      background: white; padding: 20px;
      border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1, h2 { margin-top: 0; }
    
    /* フォーム要素 */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="time"] {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 4px; box-sizing: border-box;
    }
    button {
      background-color: var(--primary); color: white; border: none;
      padding: 10px 15px; border-radius: 4px; font-size: 16px;
      cursor: pointer; width: 100%;
    }
    button:hover { background-color: var(--primary-hover); }

    /* メンバ画面 UI */
    .countdown-box {
      text-align: center; margin: 30px 0; padding: 20px;
      background: #1f2937; color: white; border-radius: 8px;
    }
    .countdown-time { font-size: 3rem; font-weight: bold; font-variant-numeric: tabular-nums; }
    .status-text { font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; }
    .status-waiting { color: #f59e0b; }
    .status-marching { color: #3b82f6; }
    .status-arrived { color: #10b981; }

    /* 指示役画面 UI */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
    th { background-color: #f9fafb; }
    .row-waiting { background-color: var(--waiting-bg); }
    .row-marching { background-color: var(--marching-bg); }
    .row-arrived { background-color: var(--arrived-bg); }
    .command-panel { background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .command-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 500px) { .command-grid { grid-template-columns: 1fr; } }
    .hidden { display: none !important; }
    .member-settings {
      margin-bottom: 20px; border: 1px solid #d1d5db; border-radius: 8px;
      background: #f9fafb;
    }
    .member-settings summary {
      cursor: pointer; padding: 12px 15px; font-weight: bold;
    }
    .member-settings form { padding: 0 15px 15px; }
    .close-room-button {
      width: auto; background-color: #b91c1c; margin-top: 15px;
    }
    .member-selection-actions {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .member-selection-actions button {
      width: auto; font-size: 0.9rem; padding: 8px 12px;
    }
    .timezone-control {
      display: flex; align-items: center; gap: 8px; margin-bottom: 15px;
      font-size: 0.9rem;
    }
    .timezone-control select { width: auto; padding: 6px 8px; }
  </style>
</head>
<body>

  <!-- メンバ用画面 -->
  <div id="member-view" class="container hidden">
    <h2>🎯 メンバ参加画面</h2>
    <div class="timezone-control">
      <label for="member-timezone">時刻表示</label>
      <select id="member-timezone" onchange="changeTimezone(this.value)">
        <option value="UTC">UTC</option>
        <option value="JST">JST</option>
      </select>
    </div>
    <div class="countdown-box">
      <div id="member-status" class="status-text">状態: 未接続</div>
      <div id="member-countdown" class="countdown-time">--:--:--</div>
      <div style="margin-top: 15px; font-size: 0.9rem;">
        <div>出発時刻: <span id="member-departure">未定</span></div>
        <div>到着時刻: <span id="member-arrival">未定</span></div>
      </div>
    </div>

    <details id="member-settings" class="member-settings" open>
      <summary>登録情報を表示 / 編集</summary>
      <form id="member-form" onsubmit="event.preventDefault(); submitMemberData();">
        <div class="form-group">
          <label for="room-id">合言葉 (ルームID)</label>
          <input type="text" id="room-id" placeholder="例: alliance-a" required>
        </div>
        <div class="form-group">
          <label for="member-name">名前</label>
          <input type="text" id="member-name" required>
        </div>
        <div class="form-group">
          <label for="march-time">行軍時間 (秒)</label>
          <input type="number" id="march-time" required>
        </div>
        <button type="submit">登録 / 状態更新</button>
      </form>
    </details>
  </div>

  <!-- 指示役用画面 -->
  <div id="commander-view" class="container hidden">
    <h2>👑 指示役画面</h2>
    <div class="timezone-control">
      <label for="commander-timezone">時刻表示</label>
      <select id="commander-timezone" onchange="changeTimezone(this.value)">
        <option value="UTC">UTC</option>
        <option value="JST">JST</option>
      </select>
    </div>
    <div class="form-group" style="display: flex; gap: 10px;">
      <input type="text" id="cmd-room-id" placeholder="合言葉" style="flex: 1;">
      <button onclick="initCommanderRoom()" style="width: auto;">監視開始</button>
    </div>
    <button id="close-room-button" class="close-room-button hidden" onclick="closeCommanderRoom()">ルームを閉じる</button>

    <div class="table-responsive">
      <div class="member-selection-actions" aria-label="メンバ一括選択">
        <button type="button" onclick="selectAllMembers()">全員選択</button>
        <button type="button" onclick="selectAvailableMembers()">待機中・行軍中を除く全員選択</button>
        <button type="button" onclick="selectArrivedMembers()">到着済み全員選択</button>
        <button type="button" onclick="resetSelectedMembers()">選択メンバを指示待ちに戻す</button>
      </div>
      <table id="members-table">
        <thead>
          <tr>
            <th>選択</th>
            <th>名前</th>
            <th>状態</th>
            <th>行軍時間</th>
            <th>出発まで</th>
            <th>出発時刻</th>
            <th>到着時刻</th>
          </tr>
        </thead>
        <tbody id="members-tbody">
          <!-- JSで動的に行を追加 -->
        </tbody>
      </table>
    </div>

    <div class="command-panel">
      <h3>📢 号令コマンド</h3>
      <div class="command-grid">
        <button onclick="sendCommandReady()" style="background-color: #059669;">
          ⏱ 行軍準備号令<br><small>(一番遠い人が5秒後出発を基準にする)</small>
        </button>
        <div style="border: 1px solid #ccc; padding: 10px; border-radius: 4px; text-align: center; background: white;">
          <label for="target-time-input" id="target-time-label">到着時刻指定 (UTC)</label>
          <input type="time" id="target-time-input" step="1" style="margin-bottom: 10px;" onchange="updateTargetTimeMinimum()" oninput="updateTargetTimeMinimum()">
          <small id="target-time-minimum" style="display: block; margin-bottom: 10px; color: #6b7280;"></small>
          <button onclick="sendCommandTarget()">指定時刻で到着指示</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 構成設定 ---
    const WORKER_URL = "https://webapp.kiironoangel.workers.dev/commander-room";
    
    // --- 状態管理 ---
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role') === 'commander' ? 'commander' : 'member';
    const myMemberId = "member-" + Math.floor(Math.random() * 100000);
    
    let ws = null;
    let serverOffset = 0;
    let currentRoomId = null;
    let syncInterval = null;
    let timezone = localStorage.getItem('rally_commander_timezone') || 'UTC';

    // メンバ用ステート
    let myState = { departure_time: null, target_time: null };
    // 指示役用ステート
    let allMembers = [];

    // --- 画面初期化 ---
    if (role === 'commander') {
      document.getElementById('commander-view').classList.remove('hidden');
    } else {
      document.getElementById('member-view').classList.remove('hidden');
    }
    document.getElementById(`${role}-timezone`).value = timezone;

    // --- ユーティリティ ---
    function getServerTime() {
      return Date.now() + serverOffset;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '--:--:--';
      const d = new Date(timestamp);
      const displayDate = timezone === 'JST' ? new Date(timestamp + 9 * 60 * 60 * 1000) : d;
      const hours = displayDate.getUTCHours();
      const minutes = displayDate.getUTCMinutes();
      const seconds = displayDate.getUTCSeconds();
      return hours.toString().padStart(2, '0') + ':' +
             minutes.toString().padStart(2, '0') + ':' +
             seconds.toString().padStart(2, '0');
    }

    function changeTimezone(value) {
      timezone = value === 'JST' ? 'JST' : 'UTC';
      localStorage.setItem('rally_commander_timezone', timezone);
      document.getElementById('member-timezone').value = timezone;
      document.getElementById('commander-timezone').value = timezone;
      if (role === 'commander') {
        updateCommanderTable(allMembers);
        updateTargetTimeMinimum();
      } else {
        document.getElementById('member-departure').textContent = formatTime(myState.departure_time);
        document.getElementById('member-arrival').textContent = formatTime(myState.target_time);
      }
    }

    function formatCountdown(ms) {
      if (ms < 0) return "00:00:00";
      const totalSec = Math.ceil(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function formatInputTime(timestamp) {
      const displayDate = timezone === 'JST'
        ? new Date(timestamp + 9 * 60 * 60 * 1000)
        : new Date(timestamp);
      return `${displayDate.getUTCHours().toString().padStart(2, '0')}:${displayDate.getUTCMinutes().toString().padStart(2, '0')}:${displayDate.getUTCSeconds().toString().padStart(2, '0')}`;
    }

    function getSelectedMembers() {
      const selectedIds = new Set(getSelectedMemberIds());
      return allMembers.filter(member => selectedIds.has(member.member_id));
    }

    function getEarliestTargetTime() {
      const maxMarchTime = getSelectedMembers().reduce(
        (longest, member) => Math.max(longest, Number(member.march_time) || 0),
        0,
      );
      return getServerTime() + (maxMarchTime * 1000);
    }

    function updateTargetTimeMinimum() {
      if (role !== 'commander') return;
      const minimumTimestamp = getEarliestTargetTime();
      const input = document.getElementById('target-time-input');
      const label = document.getElementById('target-time-label');
      const minimumLabel = document.getElementById('target-time-minimum');
      label.textContent = `到着時刻指定 (${timezone})`;
      input.min = formatInputTime(minimumTimestamp);
      minimumLabel.textContent = `最短到着可能時刻: ${formatTime(minimumTimestamp)}`;
    }

    function getTargetTimestamp(timeInput) {
      const [hours, minutes, seconds] = timeInput.split(':').map(Number);
      const now = new Date(getServerTime());
      const displayNow = timezone === 'JST'
        ? new Date(now.getTime() + 9 * 60 * 60 * 1000)
        : now;
      let targetTime = Date.UTC(
        displayNow.getUTCFullYear(),
        displayNow.getUTCMonth(),
        displayNow.getUTCDate(),
        hours,
        minutes,
        seconds || 0,
      ) - (timezone === 'JST' ? 9 * 60 * 60 * 1000 : 0);
      if (targetTime < getServerTime()) targetTime += 24 * 60 * 60 * 1000;
      return targetTime;
    }

    // --- WebSocket 通信管理 ---
    async function connectWebSocket(roomId) {
      if (ws) ws.close();
      currentRoomId = roomId;
      const socketUrl = new URL(WORKER_URL);
      socketUrl.protocol = socketUrl.protocol === 'https:' ? 'wss:' : 'ws:';
      socketUrl.searchParams.set('room', await hashRoomId(roomId));
      ws = new WebSocket(socketUrl.toString());

      ws.onopen = () => {
        console.log("WebSocket接続完了");
        if (role === 'commander') {
          ws.send(JSON.stringify({ type: "join", payload: { role: 'commander' } }));
        }
        sendPing();
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(sendPing, 30000); // 30秒ごとの同期
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'pong') {
          const now = Date.now();
          const latency = now - data.payload.client_time;
          serverOffset = data.payload.server_time + (latency / 2) - now;
          console.log(`時刻補正: オフセット ${serverOffset}ms (レイテンシ ${latency}ms)`);
        }

        if (data.type === 'command-error') {
          alert(data.message || '指示を送信できませんでした');
          return;
        }

        if (data.type === 'state_update') {
          if (role === 'commander') {
            allMembers = data.payload.members || [];
            updateCommanderTable(allMembers);
          } else {
            myState = data.payload;
            document.getElementById('member-departure').textContent = formatTime(myState.departure_time);
            document.getElementById('member-arrival').textContent = formatTime(myState.target_time);
            if (!myState.target_time || !myState.departure_time) {
              document.getElementById('member-countdown').textContent = '--:--:--';
              document.getElementById('member-status').className = 'status-text';
              document.getElementById('member-status').textContent = '状態: 指示待ち';
            }
          }
        }

        if (data.type === 'member-reset' && role === 'member') {
          myState = { departure_time: null, target_time: null };
          document.getElementById('member-departure').textContent = '未定';
          document.getElementById('member-arrival').textContent = '未定';
          document.getElementById('member-countdown').textContent = '--:--:--';
          document.getElementById('member-status').className = 'status-text';
          document.getElementById('member-status').textContent = '状態: 指示待ち';
        }

        if (data.type === 'room-closed') {
          if (syncInterval) clearInterval(syncInterval);
          syncInterval = null;
          currentRoomId = null;
          myState = { departure_time: null, target_time: null };
          document.getElementById('member-status').textContent = '状態: ルーム終了';
          document.getElementById('member-countdown').textContent = '--:--:--';
          document.getElementById('member-departure').textContent = '未定';
          document.getElementById('member-arrival').textContent = '未定';
          document.getElementById('member-settings').open = true;
        }
      };

      ws.onclose = () => {
        console.log("WebSocket切断");
      };
    }

    async function hashRoomId(roomId) {
      const data = new TextEncoder().encode(roomId);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(hash)]
        .map(byte => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    function sendPing() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "ping", payload: { client_time: Date.now() } }));
      }
    }

    // --- 自動復帰トリガー ---
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentRoomId) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          connectWebSocket(currentRoomId);
        } else {
          sendPing(); // 即座に時刻のズレを修正
        }
      }
    });

    // --- メンバ用アクション ---
    function submitMemberData() {
      const roomId = document.getElementById('room-id').value;
      const name = document.getElementById('member-name').value;
      const marchTime = parseInt(document.getElementById('march-time').value, 10);

      // 初回接続またはルーム変更時
      if (currentRoomId !== roomId || !ws || ws.readyState !== WebSocket.OPEN) {
        connectWebSocket(roomId);
        // 接続確立を待ってからデータを送信
        const waitForOpen = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) {
            clearInterval(waitForOpen);
            sendMemberJoin(name, marchTime);
          }
        }, 100);
      } else {
        // すでに接続済みの場合はそのまま更新
        sendMemberJoin(name, marchTime);
      }
      document.getElementById('member-status').textContent = '状態: 指示待ち';
      document.getElementById('member-status').className = 'status-text';
      document.getElementById('member-settings').open = false;
    }

    function sendMemberJoin(name, marchTime) {
      ws.send(JSON.stringify({
        type: "join",
        payload: { role: 'member', member_id: myMemberId, name: name, march_time: marchTime }
      }));
    }

    // --- 指示役用アクション ---
    function initCommanderRoom() {
      const roomId = document.getElementById('cmd-room-id').value;
      if (!roomId) return alert("合言葉を入力してください");
      connectWebSocket(roomId);
      document.getElementById('close-room-button').classList.remove('hidden');
    }

    function closeCommanderRoom() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (!confirm('このルームを閉じて、メンバの接続を解除しますか？')) return;
      ws.send(JSON.stringify({ type: 'close-room' }));
      document.getElementById('close-room-button').classList.add('hidden');
    }

    function getSelectedMemberIds() {
      return Array.from(document.querySelectorAll('.member-checkbox:checked')).map(cb => cb.value);
    }

    function setSelectedMembers(memberIds) {
      const selectedIds = new Set(memberIds);
      document.querySelectorAll('.member-checkbox').forEach(checkbox => {
        checkbox.checked = selectedIds.has(checkbox.value);
      });
      updateTargetTimeMinimum();
    }

    function selectAllMembers() {
      setSelectedMembers(allMembers.map(member => member.member_id));
    }

    function selectAvailableMembers() {
      const now = getServerTime();
      const availableMembers = allMembers.filter(member => {
        const isAssigned = Number.isFinite(member.departure_time) && Number.isFinite(member.target_time);
        const isInProgress = isAssigned && now < member.target_time;
        return !isInProgress;
      });
      setSelectedMembers(availableMembers.map(member => member.member_id));
    }

    function selectArrivedMembers() {
      const now = getServerTime();
      const arrivedMembers = allMembers.filter(member =>
        Number.isFinite(member.target_time) && now >= member.target_time,
      );
      setSelectedMembers(arrivedMembers.map(member => member.member_id));
    }

    function resetSelectedMembers() {
      const targetIds = getSelectedMemberIds();
      if (targetIds.length === 0) return alert("対象メンバを選択してください");
      if (!confirm('選択したメンバを指示待ちに戻しますか？')) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return alert("ルームに接続していません");
      ws.send(JSON.stringify({ type: 'reset-members', payload: { target_member_ids: targetIds } }));
    }

    function sendCommandReady() {
      const targetIds = getSelectedMemberIds();
      if (targetIds.length === 0) return alert("対象メンバを選択してください");
      ws.send(JSON.stringify({ type: 'command_ready', payload: { target_member_ids: targetIds } }));
    }

    function sendCommandTarget() {
      const timeInput = document.getElementById('target-time-input').value; // "HH:MM:SS"
      const targetIds = getSelectedMemberIds();
      if (!timeInput) return alert("時刻を指定してください");
      if (targetIds.length === 0) return alert("対象メンバを選択してください");

      const targetTime = getTargetTimestamp(timeInput);
      const minimumTargetTime = getEarliestTargetTime();
      if (targetTime < minimumTargetTime) {
        alert(`指定時刻では間に合わないメンバがいます。\n最短到着可能時刻: ${formatTime(minimumTargetTime)} (${timezone})`);
        return;
      }

      ws.send(JSON.stringify({ type: 'command_target', payload: { target_member_ids: targetIds, target_time: targetTime } }));
    }

    function updateCommanderTable(members) {
      const tbody = document.getElementById('members-tbody');
      // 現在チェックされているメンバIDを保持
      const checkedIds = new Set(getSelectedMemberIds());

      tbody.innerHTML = '';
      members.forEach(member => {
        const isChecked = checkedIds.has(member.member_id) ? 'checked' : '';
        const tr = document.createElement('tr');
        tr.id = `row-${member.member_id}`;
        
        tr.innerHTML = `
          <td><input type="checkbox" class="member-checkbox" value="${member.member_id}" ${isChecked}></td>
          <td>${member.name}</td>
          <td id="status-${member.member_id}">指示待ち</td>
          <td>${member.march_time}秒</td>
          <td id="countdown-${member.member_id}" style="font-variant-numeric: tabular-nums;">--</td>
          <td>${formatTime(member.departure_time)}</td>
          <td>${formatTime(member.target_time)}</td>
        `;
        tbody.appendChild(tr);
      });
      updateTargetTimeMinimum();
    }

    // --- 描画ループ (毎フレーム更新) ---
    function renderLoop() {
      const now = getServerTime();

      if (role === 'member' && myState.target_time && myState.departure_time) {
        const display = document.getElementById('member-countdown');
        const statusEl = document.getElementById('member-status');

        if (now < myState.departure_time) {
          const remainingMs = myState.departure_time - now;
          display.textContent = formatCountdown(remainingMs);
          statusEl.className = 'status-text status-waiting';
          statusEl.textContent = '状態: 行軍待機中';
        } else if (now < myState.target_time) {
          display.textContent = "行軍中！";
          statusEl.className = 'status-text status-marching';
          statusEl.textContent = '状態: 行軍中';
        } else {
          display.textContent = "着弾！";
          statusEl.className = 'status-text status-arrived';
          statusEl.textContent = '状態: 到着完了';
        }
      } 
      else if (role === 'commander') {
        allMembers.forEach(member => {
          const tr = document.getElementById(`row-${member.member_id}`);
          const statusEl = document.getElementById(`status-${member.member_id}`);
          const countdownEl = document.getElementById(`countdown-${member.member_id}`);
          if (!tr) return;

          if (!member.target_time || !member.departure_time) {
            tr.className = '';
            statusEl.textContent = '指示待ち';
            countdownEl.textContent = '--';
            return;
          }

          if (now < member.departure_time) {
            tr.className = 'row-waiting';
            statusEl.textContent = '待機中';
            countdownEl.textContent = Math.ceil((member.departure_time - now) / 1000) + '秒';
          } else if (now < member.target_time) {
            tr.className = 'row-marching';
            statusEl.textContent = '行軍中';
            countdownEl.textContent = '出発済';
          } else {
            tr.className = 'row-arrived';
            statusEl.textContent = '到着';
            countdownEl.textContent = '着弾';
          }
        });
      }

      requestAnimationFrame(renderLoop);
    }

    // 描画ループ開始
    requestAnimationFrame(renderLoop);

  </script>
