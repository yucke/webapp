<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOS_王城集結着弾時間計算</title>
<style>
body{font-family:Arial;background:#111;color:#eee;padding:16px}
.card{background:#222;padding:12px;border-radius:10px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{padding:6px;background:#333;color:#fff;border:1px solid #555;border-radius:6px}
input{padding:6px;background:#333;color:#fff;border:1px solid #555;border-radius:6px}
input[type=number]{width: 40px;} 
button{padding:8px 12px;margin:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.small{font-size:.8em;color:#aaa}
</style></head><body>
<h2>WOS Sunfire</h2>
<div id="clock"></div>
<button id="add">＋カード追加</button>
<button id="sort">到着時刻順に並び替え</button>
<div id="cards"></div>
<script>
const CX=600,CY=600;
let cards=JSON.parse(localStorage.getItem("wos_cards2")||"[]");
if(cards.length===0)cards=[{name:"",x:600,y:600}];

function secs(c){
 // 本当の中心座標(599, 599) の場合は0秒とする
 if(c.x === 599 && c.y === 599) return 0;

 // 中心からの距離の差分を計算
 const dx = c.x - 599;
 const dy = c.y - 599;
 
 // 直線距離（ユークリッド距離）を計算
 const dist = Math.sqrt(dx * dx + dy * dy);
 
 // 傾き4.29、切片6で計算（四捨五入）
 return Math.round(4.29 * dist + 6);
}



function fmt(d){return d.toLocaleTimeString("ja-JP",{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function save(){localStorage.setItem("wos_cards2",JSON.stringify(cards));}
function render(){
 const wrap=document.getElementById("cards");wrap.innerHTML="";
 cards.forEach((c,i)=>{
  const div=document.createElement("div");div.className="card";
  div.innerHTML=`<div class=row>
<input class=name placeholder="名前" value="${c.name}">
X<input type=number placeholder="X" value="${c.x}" min="0" max="1199">
Y<input type=number placeholder="Y" value="${c.y}" min="0" max="1199">
<button>削除</button></div>
<div class=grid>
<div><div class=small>移動時間</div><b class=sec></b></div>
<div><div class=small>今出発</div><b class=now></b></div>
<div><div class=small>5分後</div><b class=p5></b></div>
<div><div class=small>10分後</div><b class=p10></b></div></div>`;
  const ins=div.querySelectorAll("input");
  ins[0].oninput=e=>{cards[i].name=e.target.value;save();}
  ins[1].oninput=e=>{cards[i].x=+e.target.value;save();updateCard(div,cards[i]);}
  ins[2].oninput=e=>{cards[i].y=+e.target.value;save();updateCard(div,cards[i]);}
  div.querySelector("button").onclick=()=>{cards.splice(i,1);if(!cards.length)cards=[{name:"",x:600,y:600}];save();render();}
  wrap.appendChild(div);updateCard(div,c);
 });
}
function updateCard(div,c){
 let s=secs(c),n=Date.now();
 div.querySelector(".sec").textContent=s+" 秒";
 div.querySelector(".now").textContent=fmt(new Date(n+s*1000));
 div.querySelector(".p5").textContent=fmt(new Date(n+5*60000+s*1000));
 div.querySelector(".p10").textContent=fmt(new Date(n+10*60000+s*1000));
}
function tick(){
 document.getElementById("clock").textContent="現在時刻: "+fmt(new Date());
 document.querySelectorAll(".card").forEach((d,i)=>updateCard(d,cards[i]));
}
document.getElementById("add").onclick=()=>{cards.push({name:"",x:600,y:600});save();render();}
document.getElementById("sort").onclick=()=>{cards.sort((a,b)=>secs(a)-secs(b));save();render();}
render();tick();setInterval(tick,1000);
</script></body></html>
