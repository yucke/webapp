name = "wos-rally-tracker"
main = "worker.js"
compatibility_date = "2026-08-30"

# ==========================================
# バインディング
# ==========================================
[[durable_objects.bindings]]
name = "RALLY_ROOMS"
class_name = "RallyRoom"

[[durable_objects.bindings]]
name = "FORTLESS_ROOMS"
class_name = "FortlessRoom"

[[durable_objects.bindings]]
name = "COMMANDER_ROOMS"
class_name = "CommanderRoom"

# ==========================================
# 新しいDOクラスを登録するためのマイグレーション
# ==========================================
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RallyRoom", "FortlessRoom", "CommanderRoom"]

[env.production]
vars = { ENVIRONMENT = "production" }

[assets]
directory = "."