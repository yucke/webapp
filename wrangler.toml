name = "wos-rally-tracker"
main = "worker.js"
compatibility_date = "2026-08-30"

[[durable_objects.bindings]]
name = "RALLY_ROOMS"
class_name = "RallyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RallyRoom"]

[env.production]
vars = { ENVIRONMENT = "production" }

[build]
command = "npm run build"
cwd = "."

[[build.upload.rules]]
type = "CompiledContentType"
globs = ["**/*.html", "**/*.css", "**/*.js"]
fallthrough = true

[assets]
directory = "."
include = ["*.html", "*.css"]
exclude = ["worker.js", "wrangler.toml", "package.json", ".github/**/*", "README.md"]
