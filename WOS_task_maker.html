<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週間タスク表合成エディタ</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    h2 { margin: 0; font-size: 1.5rem; color: var(--primary); }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    .tab.active {
      background: var(--card);
      border-bottom-color: var(--card);
      color: var(--primary);
      font-weight: bold;
    }

    .add-tab-btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .event-settings {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .event-name-input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 200px;
    }

    .column-shift-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-shift {
      background: #f59e0b;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      padding: 0;
    }

    .btn-shift:hover {
      background: #d97706;
    }

    .template-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .template-select {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 300px; }
    th, td { border: 1px solid var(--border); padding: 3px; text-align: center; }
    th { background: #f8fafc; font-size: 0.85rem; width:15px; }

    .mission-input {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-add-row { background: #10b981; color: white; }
    .btn-remove-row { background: #ef4444; color: white; padding: 4px 8px; }
    .btn-generate { 
      background: var(--primary); 
      color: white; 
      width: 100%; 
      padding: 15px; 
      font-size: 1.1rem;
      transition: background 0.2s;
    }
    
    .btn-generate.success {
      background: #10b981;
    }

    /* 新しい4段階ボタンのスタイル */
    .state-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      user-select: none;
    }
    .state-btn:hover { background: #f1f5f9; }
    
    /* 段階ごとの色分け */
    .state-btn[data-value="1"] { color: #3b82f6; background: #eff6ff; border-color: #bfdbfe; } /* △: 青系 */
    .state-btn[data-value="2"] { color: #10b981; background: #ecfdf5; border-color: #a7f3d0; } /* 〇: 緑系 */
    .state-btn[data-value="3"] { color: #ef4444; background: #fef2f2; border-color: #fecaca; } /* ◎: 赤系 */

    .symbol-settings {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .symbol-input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 150px;
    }

    textarea {
      width: 100%;
      height: 250px;
      margin-top: 15px;
      font-family: monospace;
      padding: 12px;
      border-radius: 8px;
      background: #1e293b;
      color: #f1f5f9;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>週間タスク表合成エディタ</h2>
  </header>

  <div class="tabs-container" id="tabs">
    <button class="add-tab-btn" onclick="addEvent()">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <div id="active-event-editor">
    <div class="event-settings">
      <label>イベント名:</label>
      <input type="text" id="current-event-name" class="event-name-input" oninput="updateEventName(this.value)">
      <button class="btn btn-add-row" onclick="addRow()">
        <i data-lucide="list-plus"></i> ミッション追加
      </button>
      <div class="column-shift-controls">
        <button class="btn-shift" onclick="shiftColumnsLeft()" title="列を左に移動">←</button>
        <span style="font-size: 0.9rem; color: #666;">曜日シフト</span>
        <button class="btn-shift" onclick="shiftColumnsRight()" title="列を右に移動">→</button>
      </div>
    </div>

    <div class="template-controls">
      <label>テンプレート:</label>
      <select id="template-select" class="template-select" onchange="applyTemplate()">
        <option value="">-- 選択してください --</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Msn</th>
            <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th>
            <th style="width: 40px;">削除</th>
          </tr>
        </thead>
        <tbody id="mission-body"></tbody>
      </table>
    </div>
  </div>

  <div class="symbol-settings">
    <label>出力記号（優先度高い順）:</label>
    <input type="text" id="symbol-input" class="symbol-input" placeholder="例: ◎〇△□◇＊" value="◎〇△□◇＊" onchange="saveSettings()">
  </div>

  <button class="btn btn-generate" onclick="generateOutput()">
    <i data-lucide="file-text"></i> テキスト表を作成してコピー
  </button>

  <textarea id="outputText" readonly placeholder="ここに出力結果が表示されます..."></textarea>
</div>

<datalist id="mission-list">
  <option value="総力"></option><option value="火晶"></option>
  <option value="加速"></option><option value="訓練"></option>
  <option value="欠片"></option><option value="領主装"></option>
  <option value="領主宝"></option><option value="英装備"></option>
  <option value="採集"></option><option value="ラキル"></option>
  <option value="ペット"></option><option value="鍵募集"></option>
  <option value="野巨獣"></option><option value="ダイヤ"></option>
  <option value="専門家"></option>
</datalist>

<script>
  const STORAGE_KEY = 'wos_task_maker_data_v2'; // データ構造が変わったためキーを更新（またはマイグレーション）
  const SETTINGS_KEY = 'wos_task_maker_settings';
  const TEMPLATES_KEY = 'wos_task_maker_templates';
  
  let events = [{ id: Date.now(), name: "イベント 1", missions: {} }];
  let activeEventId = events[0].id;
  let templates = [];
  
  const defaultMissions = ["総力", "火晶", "加速", "訓練", "欠片", "領主装", "領主宝", "英装備", "採集", "ラキル", "ペット", "鍵募集", "野巨獣", "ダイヤ", "専門家"];
  
  const toFullWidth = (num) => String(num).replace(/[0-9]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));

  // 文字列の表示幅を計算（全角=2、半角=1）
  const getStringWidth = (str) => {
    let width = 0;
    for (let char of str) {
      const code = char.charCodeAt(0);
      if ((code >= 0x2E80 && code <= 0x9FFF) || 
          (code >= 0x3040 && code <= 0x309F) || 
          (code >= 0x30A0 && code <= 0x30FF) || 
          (code >= 0xFF00 && code <= 0xFFEF)) { 
        width += 2;
      } else {
        width += 1;
      }
    }
    return width;
  };

  const padStringToWidth = (str, targetWidth) => {
    let currentWidth = getStringWidth(str);
    let padding = targetWidth - currentWidth;
    if (padding <= 0) return str.slice(0, targetWidth);
    return str + '　'.repeat(Math.ceil(padding / 2)) + ' '.repeat(padding % 2);
  };

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (e) {
      console.error('Failed to save to localStorage:', e);
    }
  }

  function loadFromStorage() {
    try {
      // 以前のキー(wos_task_maker_data)からのマイグレーションも試みる
      let saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('wos_task_maker_data');
      if (saved) {
        events = JSON.parse(saved);
        if (events.length === 0) {
          events = [{ id: Date.now(), name: "イベント 1", missions: {} }];
        }
        
        // マイグレーション: boolean (true/false) を 数値 (3/0) に変換
        events.forEach(ev => {
          Object.keys(ev.missions).forEach(m => {
            ev.missions[m] = ev.missions[m].map(val => {
              if (val === true) return 3; // 以前ONだったものは◎(3)として復元
              if (val === false) return 0;
              return typeof val === 'number' ? val : 0;
            });
          });
        });
        
        activeEventId = events[0].id;
      }
    } catch (e) {
      console.error('Failed to load from localStorage:', e);
    }
  }

  function saveSettings() {
    try {
      const settings = {
        symbols: document.getElementById('symbol-input').value
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      console.error('Failed to save settings:', e);
    }
  }

  function loadSettings() {
    try {
      const saved = localStorage.getItem(SETTINGS_KEY);
      if (saved) {
        const settings = JSON.parse(saved);
        if (settings.symbols) {
          document.getElementById('symbol-input').value = settings.symbols;
        }
      }
    } catch (e) {
      console.error('Failed to load settings:', e);
    }
  }

  function loadTemplates() {
    // デフォルトテンプレートの定義
    const defaultTemplates = [
      {
        "name": "季節イベント",
        "missions": {
          "総力": [1,0,0,0,0,1,0],
          "加速": [0,0,1,0,0,0,1],
          "訓練": [0,0,0,1,0,0,0],
          "欠片": [1,0,1,0,0,0,0],
          "領主装": [0,0,0,0,0,0,1],
          "英装備": [0,0,0,0,0,1,0],
          "採集": [0,0,0,0,0,1,0],
          "鍵募集": [1,0,1,0,0,0,0],
          "野巨獣": [0,1,0,0,0,0,0],
          "ダイヤ": [0,0,0,0,1,0,0]
        }
      },
      {
        "name": "氷原支配者",
        "missions": {
          "火晶": [1,1,0,0,1,0,1],
          "加速": [1,1,0,0,1,0,1],
          "訓練": [0,0,0,1,0,1,0],
          "欠片": [0,1,1,0,0,0,1],
          "領主装": [0,0,0,0,0,1,1],
          "領主宝": [1,0,1,1,0,0,0],
          "英装備": [0,1,0,1,1,0,0],
          "採集": [0,0,0,0,0,0,1],
          "ラキル": [0,1,1,0,0,0,0],
          "ペット": [0,0,1,0,0,0,1],
          "専門家": [0,1,1,0,0,0,0]
        }
      },
      {
        "name": "SvS準備フェーズ",
        "missions": {
          "火晶": [1,1,0,0,1,0,0],
          "加速": [1,1,0,0,1,0,0],
          "訓練": [0,0,0,1,0,0,0],
          "欠片": [0,1,1,0,0,0,0],
          "領主装": [0,0,0,0,1,0,0],
          "領主宝": [1,0,1,1,0,0,0],
          "英装備": [0,0,0,1,1,0,0],
          "採集": [0,1,0,0,0,0,0],
          "ラキル": [0,1,1,0,0,0,0],
          "ペット": [0,0,1,0,1,0,0],
          "野巨獣": [0,0,1,0,0,0,0],
          "専門家": [0,1,1,0,0,0,0]
        }
      },
      {
        "name": "軍備士官",
        "missions": {
          "火晶": [1,1,0,0,0,0,0],
          "加速": [1,1,0,0,0,0,0],
          "訓練": [0,0,1,1,0,0,0],
          "欠片": [1,1,0,0,0,0,1],
          "領主装": [1,1,0,0,1,1,1],
          "領主宝": [0,0,1,1,0,0,0],
          "英装備": [0,0,1,1,1,1,1],
          "専門家": [1,1,0,0,0,0,0]
        }
      },
      {
        "name": "同盟大作戦",
        "missions": {
          "火晶": [1,1,0,0,1,1,1],
          "加速": [1,1,0,0,1,1,1],
          "訓練": [0,0,0,1,0,0,0],
          "欠片": [0,1,0,0,0,0,0],
          "領主装": [0,0,0,0,1,1,1],
          "領主宝": [0,0,1,1,0,1,1],
          "英装備": [0,0,0,1,0,1,1],
          "採集": [1,0,1,0,0,0,0],
          "ペット": [0,0,1,0,0,1,1],
          "ダイヤ": [1,1,1,1,1,1,1],
          "トラ": [1,1,1,1,1,1,1]
        }
      }
    ];

    try {
      const saved = localStorage.getItem(TEMPLATES_KEY);
      let parsed = saved ? JSON.parse(saved) : null;
      if (parsed && parsed.length > 0) {
        templates = parsed;
      } else {
        templates = defaultTemplates;
        localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates));
      }
    } catch (e) {
      console.error('Failed to load templates:', e);
      templates = defaultTemplates;
    }
    
    updateTemplateSelect();
  }

  function updateTemplateSelect() {
    const select = document.getElementById('template-select');
    const options = select.querySelectorAll('option:not(:first-child)');
    options.forEach(opt => opt.remove());
    
    templates.forEach((template, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = template.name;
      select.appendChild(option);
    });
  }

  function applyTemplate() {
    const select = document.getElementById('template-select');
    const index = select.value;
    
    if (index === '') return;
    
    const template = templates[index];
    if (!template) return;
    
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    ev.name = template.name;
    ev.missions = {};
    Object.keys(template.missions).forEach(missionName => {
      const checks = template.missions[missionName];
      // テンプレートの数値をそのまま適用（旧仕様のbooleanのみ変換）
      ev.missions[missionName] = checks.map(c => {
        if (c === true) return 3;
        if (c === false) return 0;
        return typeof c === 'number' ? c : 0;
      });
    });
    
    saveToStorage();
    renderEditor();
    select.value = ''; 
  }

  function init() {
    loadFromStorage();
    loadSettings();
    loadTemplates();

    // 初期化：保存されたデータがない場合のみデフォルトを適用
    if (events[0].missions && Object.keys(events[0].missions).length === 0) {
      defaultMissions.forEach(m => {
        events[0].missions[m] = [0, 0, 0, 0, 0, 0, 0];
      });
    }
    
    renderTabs();
    renderEditor();
  }

  function renderTabs() {
    const tabsContainer = document.getElementById('tabs');
    const addBtn = tabsContainer.querySelector('.add-tab-btn');
    tabsContainer.querySelectorAll('.tab').forEach(t => t.remove());
    
    events.forEach((ev) => {
      const tab = document.createElement('div');
      tab.className = `tab ${ev.id === activeEventId ? 'active' : ''}`;
      tab.onclick = () => switchEvent(ev.id);
      tab.innerHTML = `<span>${ev.name}</span>`;

      if (events.length > 1) {
        const del = document.createElement('span');
        del.style.marginLeft = "8px";
        del.innerHTML = '×';
        del.onclick = (e) => { e.stopPropagation(); removeEvent(ev.id); };
        tab.appendChild(del);
      }
      tabsContainer.insertBefore(tab, addBtn);
    });
    addBtn.style.display = events.length >= 9 ? 'none' : 'flex';
    lucide.createIcons();
  }

  function renderEditor() {
    const ev = events.find(e => e.id === activeEventId);
    document.getElementById('current-event-name').value = ev.name;
    const tbody = document.getElementById('mission-body');
    tbody.innerHTML = '';
    Object.keys(ev.missions).forEach(name => {
      tbody.appendChild(createRowElement(name, ev.missions[name]));
    });
  }

  function getDisplaySymbol(val) {
    if (val === 1) return '△';
    if (val === 2) return '〇';
    if (val === 3) return '◎';
    return '';
  }

  function createRowElement(name, valArray) {
    const tr = document.createElement('tr');
    let html = `<td><input type="text" class="mission-input" value="${name}" list="mission-list" onchange="saveCurrentState()"></td>`;
    valArray.forEach((val) => {
      html += `<td><button type="button" class="state-btn" data-value="${val}" onclick="toggleState(this)">${getDisplaySymbol(val)}</button></td>`;
    });
    html += `<td><button class="btn btn-remove-row" onclick="this.parentElement.parentElement.remove(); saveCurrentState();">×</button></td>`;
    tr.innerHTML = html;
    return tr;
  }

  function toggleState(btn) {
    let val = parseInt(btn.getAttribute('data-value') || '0', 10);
    val = (val + 1) % 4; // 0->1->2->3->0 とループ
    btn.setAttribute('data-value', val);
    btn.innerText = getDisplaySymbol(val);
    saveCurrentState();
  }

  function saveCurrentState() {
    const ev = events.find(e => e.id === activeEventId);
    if(!ev) return;
    const rows = document.querySelectorAll('#mission-body tr');
    ev.missions = {};
    rows.forEach(row => {
      const name = row.querySelector('.mission-input').value;
      if (!name) return;
      // .state-btn から data-value を数値として取得
      ev.missions[name] = Array.from(row.querySelectorAll('.state-btn')).map(btn => parseInt(btn.getAttribute('data-value') || '0', 10));
    });
    saveToStorage();
  }

  function shiftColumnsLeft() {
    saveCurrentState();
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    Object.keys(ev.missions).forEach(name => {
      const checks = ev.missions[name];
      if (checks.length === 7) {
        checks.shift();      
        checks.push(0);  // 末尾に空白(0)を追加
      }
    });
    
    saveToStorage();
    renderEditor();
  }

  function shiftColumnsRight() {
    saveCurrentState();
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    Object.keys(ev.missions).forEach(name => {
      const checks = ev.missions[name];
      if (checks.length === 7) {
        checks.pop();          
        checks.unshift(0); // 先頭に空白(0)を追加
      }
    });
    
    saveToStorage();
    renderEditor();
  }


  function addEvent() {
    if (events.length >= 9) return;
    const newId = Date.now();
    const prevMissions = events[events.length - 1].missions;
    const newMissions = {};
    Object.keys(prevMissions).forEach(name => {
      newMissions[name] = [0, 0, 0, 0, 0, 0, 0];
    });
    events.push({ id: newId, name: `イベント ${events.length + 1}`, missions: newMissions });
    activeEventId = newId;
    saveToStorage();
    renderTabs();
    renderEditor();
  }

  function removeEvent(id) {
    events = events.filter(e => e.id !== id);
    if (activeEventId === id) activeEventId = events[0].id;
    saveToStorage();
    renderTabs();
    renderEditor();
  }

  function switchEvent(id) {
    saveCurrentState();
    activeEventId = id;
    renderTabs();
    renderEditor();
  }

  function updateEventName(val) {
    const ev = events.find(e => e.id === activeEventId);
    ev.name = val;
    saveToStorage();
    renderTabs();
  }

  function addRow() {
    const tbody = document.getElementById('mission-body');
    tbody.appendChild(createRowElement("", [0, 0, 0, 0, 0, 0, 0]));
  }

  function generateOutput() {
    saveCurrentState();
    const allNames = new Set();
    events.forEach(ev => Object.keys(ev.missions).forEach(n => allNames.add(n)));
    
    const symbolInput = document.getElementById('symbol-input').value;
    const symbols = Array.from(symbolInput);
    
    // 設定された値(0~3)を、指定された記号に変換する
    const convertToSymbol = (val) => {
      if (val === 0) return "　"; // 空白
      
      const index = 3 - val; // 値3なら0番目、値2なら1番目、値1なら2番目
      if (index >= 0 && index < symbols.length) {
        return symbols[index];
      } else {
        // 設定記号が不足している場合のフォールバック
        return val === 3 ? '◎' : val === 2 ? '〇' : val === 1 ? '△' : toFullWidth(val);
      }
    };
    
    let output = "日付　月　火　水　木　金　土　日 \n";
    
    allNames.forEach(name => {
      let dayValues = [];
      let hasAny = false;
      
      for (let i = 0; i < 7; i++) {
        let maxVal = 0;
        // 複数イベントがある場合は、その曜日の各イベントの中で一番高い優先度（値）を採用する
        events.forEach(ev => { 
          if (ev.missions[name] && typeof ev.missions[name][i] === 'number') {
            maxVal = Math.max(maxVal, ev.missions[name][i]);
          } 
        });
        dayValues.push(maxVal);
        if (maxVal > 0) hasAny = true;
      }
      
      // 全く予定がない行はスキップ
      if (!hasAny) return;
      
      let rowText = padStringToWidth(name, 6);
      let daySymbols = dayValues.map(val => convertToSymbol(val));
      output += `${rowText}${daySymbols.join('┃')} \n`;
    });

    // 凡例を追加
    output += `(優先度) ${symbols[0] || '◎'} ＞ ${symbols[1] || '〇'} ＞ ${symbols[2] || '△'} \n`;

    const outputField = document.getElementById('outputText');
    outputField.value = output;
    outputField.select();
    
    // alert() を使用せず、ボタンのUIを一時的に変更して通知する
    const btn = document.querySelector('.btn-generate');
    const originalContent = btn.innerHTML;
    
    navigator.clipboard.writeText(output).then(() => {
      btn.classList.add('success');
      btn.innerHTML = '<i data-lucide="check"></i> コピーしました！';
      lucide.createIcons();
      
      setTimeout(() => {
        btn.classList.remove('success');
        btn.innerHTML = originalContent;
        lucide.createIcons();
      }, 2000);
    }).catch(err => {
      console.error('クリップボードへのコピーに失敗しました', err);
    });
  }

  window.onload = init;
</script>
</body>
</html>
