<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>週間早見表合成エディタ</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    h2 { margin: 0; font-size: 1.5rem; color: var(--primary); }

    .tabs-container {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.9rem;
    }

    .tab.active {
      background: var(--card);
      border-bottom-color: var(--card);
      color: var(--primary);
      font-weight: bold;
    }

    .add-tab-btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .event-settings {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .event-name-input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 200px;
    }

    .column-shift-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-shift {
      background: #f59e0b;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      padding: 0;
    }

    .btn-shift:hover {
      background: #d97706;
    }

    .template-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .template-select {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; min-width: 300px; }
    th, td { border: 1px solid var(--border); padding: 3px; text-align: center; }
    th { background: #f8fafc; font-size: 0.85rem; width:15px; }

    .mission-input {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-add-row { background: #10b981; color: white; }
    .btn-remove-row { background: #ef4444; color: white; padding: 4px 8px; }
    .btn-generate { 
      background: var(--primary); 
      color: white; 
      width: 100%; 
      padding: 15px; 
      font-size: 1.1rem;
    }

    .symbol-settings {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
    }

    .symbol-input {
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 150px;
    }

    textarea {
      width: 100%;
      height: 250px;
      margin-top: 15px;
      font-family: monospace;
      padding: 12px;
      border-radius: 8px;
      background: #1e293b;
      color: #f1f5f9;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>週間タスク表合成エディタ</h2>
  </header>

  <div class="tabs-container" id="tabs">
    <button class="add-tab-btn" onclick="addEvent()">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <div id="active-event-editor">
    <div class="event-settings">
      <label>イベント名:</label>
      <input type="text" id="current-event-name" class="event-name-input" oninput="updateEventName(this.value)">
      <button class="btn btn-add-row" onclick="addRow()">
        <i data-lucide="list-plus"></i> ミッション追加
      </button>
      <div class="column-shift-controls">
        <button class="btn-shift" onclick="shiftColumnsLeft()" title="列を左に移動">←</button>
        <span style="font-size: 0.9rem; color: #666;">曜日シフト</span>
        <button class="btn-shift" onclick="shiftColumnsRight()" title="列を右に移動">→</button>
      </div>
    </div>

    <div class="template-controls">
      <label>テンプレート:</label>
      <select id="template-select" class="template-select" onchange="applyTemplate()">
        <option value="">-- 選択してください --</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Msn</th>
            <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th>
            <th style="width: 40px;">削除</th>
          </tr>
        </thead>
        <tbody id="mission-body"></tbody>
      </table>
    </div>
  </div>

  <div class="symbol-settings">
    <label>出力記号（優先度高い順）:</label>
    <input type="text" id="symbol-input" class="symbol-input" placeholder="例: ◎◯△" value="◎◯△□◇＊" onchange="saveSettings()">
  </div>

  <button class="btn btn-generate" onclick="generateOutput()">
    <i data-lucide="file-text"></i> テキスト表を作成してコピー
  </button>

  <textarea id="outputText" readonly placeholder="ここに出力結果が表示されます..."></textarea>
</div>

<datalist id="mission-list">
  <option value="総力"></option><option value="火晶"></option>
  <option value="加速"></option><option value="訓練"></option>
  <option value="欠片"></option><option value="領主装"></option>
  <option value="領主宝"></option><option value="英装備"></option>
  <option value="採集"></option><option value="ラキル"></option>
  <option value="ペット"></option><option value="鍵募集"></option>
  <option value="野巨獣"></option><option value="ダイヤ"></option>
  <option value="専門家"></option>
</datalist>

<script>
  const STORAGE_KEY = 'wos_task_maker_data';
  const SETTINGS_KEY = 'wos_task_maker_settings';
  const TEMPLATES_KEY = 'wos_task_maker_templates';
  
  let events = [{ id: Date.now(), name: "イベント 1", missions: {} }];
  let activeEventId = events[0].id;
  let templates = [];
  
  const defaultMissions = ["総力", "火晶", "加速", "訓練", "欠片", "領主装", "領主宝", "英装備", "採集", "ラキル", "ペット", "鍵募集", "野巨獣", "ダイヤ", "専門家"];
  
  const toFullWidth = (num) => String(num).replace(/[0-9]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));

  // 文字列の表示幅を計算（全角=2、半角=1）
  const getStringWidth = (str) => {
    let width = 0;
    for (let char of str) {
      const code = char.charCodeAt(0);
      // 全角判定（日本語、全角記号など）
      if ((code >= 0x2E80 && code <= 0x9FFF) || // CJK統合漢字
          (code >= 0x3040 && code <= 0x309F) || // ひらがな
          (code >= 0x30A0 && code <= 0x30FF) || // カタカナ
          (code >= 0xFF00 && code <= 0xFFEF)) { // 全角英数・記号
        width += 2;
      } else {
        width += 1;
      }
    }
    return width;
  };

  // 文字列を指定の表示幅に詰める
  const padStringToWidth = (str, targetWidth) => {
    let currentWidth = getStringWidth(str);
    let padding = targetWidth - currentWidth;
    if (padding <= 0) return str.slice(0, targetWidth);
    // 空白を足す
    return str + '　'.repeat(Math.ceil(padding / 2)) + ' '.repeat(padding % 2);
  };

  // ローカルストレージに保存
  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    } catch (e) {
      console.error('Failed to save to localStorage:', e);
    }
  }

  // ローカルストレージから復元
  function loadFromStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        events = JSON.parse(saved);
        if (events.length === 0) {
          events = [{ id: Date.now(), name: "イベント 1", missions: {} }];
        }
        activeEventId = events[0].id;
      }
    } catch (e) {
      console.error('Failed to load from localStorage:', e);
    }
  }

  // 設定を保存（記号）
  function saveSettings() {
    try {
      const settings = {
        symbols: document.getElementById('symbol-input').value
      };
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    } catch (e) {
      console.error('Failed to save settings:', e);
    }
  }

  // 設定を復元
  function loadSettings() {
    try {
      const saved = localStorage.getItem(SETTINGS_KEY);
      if (saved) {
        const settings = JSON.parse(saved);
        if (settings.symbols) {
          document.getElementById('symbol-input').value = settings.symbols;
        }
      }
    } catch (e) {
      console.error('Failed to load settings:', e);
    }
  }

  // テンプレートを読み込む
  function loadTemplates() {
    try {
      const saved = localStorage.getItem(TEMPLATES_KEY);
      if (saved) {
        templates = JSON.parse(saved);
      }
    } catch (e) {
      console.error('Failed to load templates:', e);
    }
    updateTemplateSelect();
  }

  // テンプレートセレクトを更新
  function updateTemplateSelect() {
    const select = document.getElementById('template-select');
    const options = select.querySelectorAll('option:not(:first-child)');
    options.forEach(opt => opt.remove());
    
    templates.forEach((template, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = template.name;
      select.appendChild(option);
    });
  }

  // テンプレートを適用
  function applyTemplate() {
    const select = document.getElementById('template-select');
    const index = select.value;
    
    if (index === '') return;
    
    const template = templates[index];
    if (!template) return;
    
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    // ミッション名とチェック状態を適用
    ev.missions = {};
    Object.keys(template.missions).forEach(missionName => {
      const checks = template.missions[missionName];
      // 0と1をboolean に変換
      ev.missions[missionName] = checks.map(c => c === 1 || c === true);
    });
    
    saveToStorage();
    renderEditor();
    select.value = ''; // リセット
  }

  function init() {
    loadFromStorage();
    loadSettings();
    loadTemplates();

templates = [
  {
  "name": "季節イベント",
  "missions": {
    "総力": [1,0,0,0,0,1,0],
    "加速": [0,0,1,0,0,0,1],
    "訓練": [0,0,0,1,0,0,0],
    "欠片": [1,0,1,0,0,0,0],
    "領主装": [0,0,0,0,0,0,1],
    "英装備": [0,0,0,0,0,1,0],
    "採集": [0,0,0,0,0,1,0],
    "鍵募集": [1,0,1,0,0,0,0],
    "野巨獣": [0,1,0,0,0,0,0],
    "ダイヤ": [0,0,0,0,1,0,0]
  }
},
  // さらにテンプレートを追加できます
{
  "name": "氷原支配者",
  "missions": {
    "火晶": [1,1,0,0,1,0,1],
    "加速": [1,1,0,0,1,0,1],
    "訓練": [0,0,0,1,0,1,0],
    "欠片": [0,1,1,0,0,0,1],
    "領主装": [0,0,0,0,0,1,1],
    "領主宝": [1,0,1,1,0,0,0],
    "英装備": [0,1,0,1,1,0,0],
    "採集": [0,0,0,0,0,0,1],
    "ラキル": [0,1,1,0,0,0,0],
    "ペット": [0,0,1,0,0,0,1],
    "専門家": [0,1,1,0,0,0,0]
  }
},
{
  "name": "SvS準備フェーズ",
  "missions": {
    "火晶": [1,1,0,0,1,0,0],
    "加速": [1,1,0,0,1,0,0],
    "訓練": [0,0,0,1,0,0,0],
    "欠片": [0,1,1,0,0,0,0],
    "領主装": [0,0,0,0,1,0,0],
    "領主宝": [1,0,1,1,0,0,0],
    "英装備": [0,0,0,1,1,0,0],
    "採集": [0,1,0,0,0,0,0],
    "ラキル": [0,1,1,0,0,0,0],
    "ペット": [0,0,1,0,1,0,0],
    "野巨獣": [0,0,1,0,0,0,0],
    "専門家": [0,1,1,0,0,0,0]
  }
}
];
localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates));
        
    // 初期化：保存されたデータがない場合のみデフォルトを適用
    if (events[0].missions && Object.keys(events[0].missions).length === 0) {
      defaultMissions.forEach(m => {
        events[0].missions[m] = [false, false, false, false, false, false, false];
      });
    }
    
    renderTabs();
    renderEditor();
  }

  function renderTabs() {
    const tabsContainer = document.getElementById('tabs');
    const addBtn = tabsContainer.querySelector('.add-tab-btn');
    tabsContainer.querySelectorAll('.tab').forEach(t => t.remove());
    
    events.forEach((ev) => {
      const tab = document.createElement('div');
      tab.className = `tab ${ev.id === activeEventId ? 'active' : ''}`;
      tab.onclick = () => switchEvent(ev.id);
      tab.innerHTML = `<span>${ev.name}</span>`;

      if (events.length > 1) {
        const del = document.createElement('span');
        del.style.marginLeft = "8px";
        del.innerHTML = '×';
        del.onclick = (e) => { e.stopPropagation(); removeEvent(ev.id); };
        tab.appendChild(del);
      }
      tabsContainer.insertBefore(tab, addBtn);
    });
    addBtn.style.display = events.length >= 9 ? 'none' : 'flex';
    lucide.createIcons();
  }

  function renderEditor() {
    const ev = events.find(e => e.id === activeEventId);
    document.getElementById('current-event-name').value = ev.name;
    const tbody = document.getElementById('mission-body');
    tbody.innerHTML = '';
    Object.keys(ev.missions).forEach(name => {
      tbody.appendChild(createRowElement(name, ev.missions[name]));
    });
  }

  function createRowElement(name, checkArray) {
    const tr = document.createElement('tr');
    let html = `<td><input type="text" class="mission-input" value="${name}" list="mission-list" onchange="saveCurrentState()"></td>`;
    checkArray.forEach((checked) => {
      html += `<td><input type="checkbox" class="day-check" ${checked ? 'checked' : ''} onchange="saveCurrentState()"></td>`;
    });
    html += `<td><button class="btn btn-remove-row" onclick="this.parentElement.parentElement.remove(); saveCurrentState();">×</button></td>`;
    tr.innerHTML = html;
    return tr;
  }

  function saveCurrentState() {
    const ev = events.find(e => e.id === activeEventId);
    if(!ev) return;
    const rows = document.querySelectorAll('#mission-body tr');
    ev.missions = {};
    rows.forEach(row => {
      const name = row.querySelector('.mission-input').value;
      if (!name) return;
      ev.missions[name] = Array.from(row.querySelectorAll('.day-check')).map(c => c.checked);
    });
    saveToStorage();
  }

  function shiftColumnsLeft() {
    saveCurrentState();
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    // 各ミッションの列を左にシフト（最初の列が最後に循環）
    Object.keys(ev.missions).forEach(name => {
      const checks = ev.missions[name];
      if (checks.length === 7) {
        // 最初の要素を取り出して最後に追加
        const firstValue = checks.shift();
        checks.push(firstValue);
      }
    });
    
    saveToStorage();
    renderEditor();
  }

  function shiftColumnsRight() {
    saveCurrentState();
    const ev = events.find(e => e.id === activeEventId);
    if (!ev) return;
    
    // 各ミッションの列を右にシフト（最後の列が最初に循環）
    Object.keys(ev.missions).forEach(name => {
      const checks = ev.missions[name];
      if (checks.length === 7) {
        // 最後の要素を取り出して最初に挿入
        const lastValue = checks.pop();
        checks.unshift(lastValue);
      }
    });
    
    saveToStorage();
    renderEditor();
  }

  function addEvent() {
    if (events.length >= 9) return;
    const newId = Date.now();
    // 直前のイベントのミッション名をコピー（チェック状態は全てfalseにリセット）
    const prevMissions = events[events.length - 1].missions;
    const newMissions = {};
    Object.keys(prevMissions).forEach(name => {
      newMissions[name] = [false, false, false, false, false, false, false];
    });
    events.push({ id: newId, name: `イベント ${events.length + 1}`, missions: newMissions });
    activeEventId = newId;
    saveToStorage();
    renderTabs();
    renderEditor();
  }

  function removeEvent(id) {
    events = events.filter(e => e.id !== id);
    if (activeEventId === id) activeEventId = events[0].id;
    saveToStorage();
    renderTabs();
    renderEditor();
  }

  function switchEvent(id) {
    saveCurrentState();
    activeEventId = id;
    renderTabs();
    renderEditor();
  }

  function updateEventName(val) {
    const ev = events.find(e => e.id === activeEventId);
    ev.name = val;
    saveToStorage();
    renderTabs();
  }

  function addRow() {
    const tbody = document.getElementById('mission-body');
    tbody.appendChild(createRowElement("", [false, false, false, false, false, false, false]));
  }

  function generateOutput() {
    saveCurrentState();
    const allNames = new Set();
    events.forEach(ev => Object.keys(ev.missions).forEach(n => allNames.add(n)));
    
    // 最大値を取得
    let maxCount = 0;
    allNames.forEach(name => {
      for (let i = 0; i < 7; i++) {
        for (let ev of events) {
          if (ev.missions[name] && ev.missions[name][i]) {
            let count = 0;
            events.forEach(e => { if (e.missions[name] && e.missions[name][i]) count++; });
            maxCount = Math.max(maxCount, count);
          }
        }
      }
    });

    // 記号を取得
    const symbolInput = document.getElementById('symbol-input').value;
    const symbols = Array.from(symbolInput); // 1文字ずつ配列に
    
    // 数字を記号に変換する関数
    const convertToSymbol = (num) => {
      if (num === 0) return "　";
      const index = maxCount - num; // 最大値から逆算
      if (index >= 0 && index < symbols.length) {
        return symbols[index];
      } else {
        // 記号が足りない場合は全角数字を使用
        return toFullWidth(num);
      }
    };
    
    let output = "日付　月　火　水　木　金　土　日 \n";
    allNames.forEach(name => {
      // このミッションが全イベント通じてチェックされているかを確認
      let hasAnyCheck = false;
      for (let i = 0; i < 7; i++) {
        for (let ev of events) {
          if (ev.missions[name] && ev.missions[name][i]) {
            hasAnyCheck = true;
            break;
          }
        }
        if (hasAnyCheck) break;
      }
      
      // チェックが1つもない場合はスキップ
      if (!hasAnyCheck) return;
      
      // ミッション名を全角3文字幅に揃える（全角=2、半角=1）
      let rowText = padStringToWidth(name, 6);
      let dayCounts = [];
      for (let i = 0; i < 7; i++) {
        let count = 0;
        events.forEach(ev => { if (ev.missions[name] && ev.missions[name][i]) count++; });
        dayCounts.push(convertToSymbol(count));
      }
      output += `${rowText}${dayCounts.join('┃')} \n`;
    });

    // 凡例を追加（1行空けずに次の行に出力）
    let legendItems = [];
    for (let i = 0; i < symbols.length; i++) {
      const eventCount = maxCount - i;
      if (eventCount > 0) {
        legendItems.push(`${symbols[i]}:${eventCount}イベント共通`);
      }
    }
    output += legendItems.join(' ') + " \n";

    const outputField = document.getElementById('outputText');
    outputField.value = output;
    outputField.select();
    navigator.clipboard.writeText(output).then(() => alert("コピーしました！"));
  }

  window.onload = init;
</script>
</body>
</html>
