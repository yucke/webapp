<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteout Survival 行軍割合計算機</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --shield-color: #ef4444;
            --spear-color: #10b981;
            --archer-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            font-size: 0.85rem;
            color: var(--muted-text);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title .mode-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 9999px;
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group.last {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: bold;
            text-align: right;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--border-color);
        }

        .result-row.shield { border-left-color: var(--shield-color); }
        .result-row.spear { border-left-color: var(--spear-color); }
        .result-row.archer { border-left-color: var(--archer-color); }

        .result-label {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .shield .result-value { color: var(--shield-color); }
        .spear .result-value { color: var(--spear-color); }
        .archer .result-value { color: var(--archer-color); }

        .hint-text {
            font-size: 0.75rem;
            color: var(--muted-text);
            margin-top: 12px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>行軍割合計算機</h1>
        <p>Whiteout Survival — クレイジージョイ & 熊罠</p>
    </header>

    <!-- 基本設定入力 -->
    <div class="card">
        <div class="card-title">基本設定</div>
        <div class="grid-2">
            <div class="form-group last">
                <label for="marchCount">通常出征行軍数 (ジョイ用)</label>
                <input type="text" id="marchCount" value="6" data-type="int" style="text-align: right;">
            </div>
            <div class="form-group last">
                <label style="opacity: 0;">&nbsp;</label>
                <div style="font-size: 0.8rem; color: var(--muted-text); padding-top: 12px;">
                    ※熊罠用は自動的に「通常行軍数 + 自身の集結1」で計算されます。
                </div>
            </div>
        </div>
    </div>

    <!-- 手持ち兵士数入力（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">手持ち兵士数</div>
        <div class="grid-3">
            <div class="form-group">
                <label for="shieldCount" style="color: var(--shield-color);">盾兵数</label>
                <input type="text" id="shieldCount" value="300,000" data-type="int">
            </div>
            <div class="form-group">
                <label for="spearCount" style="color: var(--spear-color);">槍兵数</label>
                <input type="text" id="spearCount" value="300,000" data-type="int">
            </div>
            <div class="form-group">
                <label for="archerCount" style="color: var(--archer-color);">弓兵数</label>
                <input type="text" id="archerCount" value="400,000" data-type="int">
            </div>
        </div>
    </div>

    <!-- 容量設定入力 -->
    <div class="card">
        <div class="card-title">出征容量設定</div>
        <div class="grid-2">
            <div class="form-group last">
                <label for="normalCapacity">通常出征容量 (ジョイ用)</label>
                <input type="text" id="normalCapacity" value="130,000" data-type="int">
            </div>
            <div class="form-group last">
                <label for="bearCapacity">熊出征容量 (専門家込)</label>
                <input type="text" id="bearCapacity" value="160,000" data-type="int">
            </div>
        </div>
    </div>

    <!-- クレイジージョイ結果（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">
            クレイジージョイ
            <span class="mode-badge" id="joyBadge">6行軍 / 優先: 盾→槍→弓</span>
        </div>
        <div class="result-row shield">
            <div class="result-label">盾兵割合</div>
            <div class="result-value" id="joyShieldPct">0%</div>
        </div>
        <div class="result-row spear">
            <div class="result-label">槍兵割合</div>
            <div class="result-value" id="joySpearPct">0%</div>
        </div>
        <div class="result-row archer">
            <div class="result-label">弓兵割合</div>
            <div class="result-value" id="joyArcherPct">0%</div>
        </div>
        <div class="hint-text" id="joyHint">※ゲーム内で上記割合を6行軍に一括設定してください。</div>
    </div>

    <!-- 熊罠結果（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">
            熊罠
            <span class="mode-badge" id="bearBadge">7行軍 / 優先: 弓→槍→盾</span>
        </div>
        <div class="result-row shield">
            <div class="result-label">盾兵割合</div>
            <div class="result-value" id="bearShieldPct">0%</div>
        </div>
        <div class="result-row spear">
            <div class="result-label">槍兵割合</div>
            <div class="result-value" id="bearSpearPct">0%</div>
        </div>
        <div class="result-row archer">
            <div class="result-label">弓兵割合</div>
            <div class="result-value" id="bearArcherPct">0%</div>
        </div>
        <div class="hint-text" id="bearHint">※自分の集結1枠＋参加6枠のすべてにこの割合を設定してください。</div>
    </div>
</div>

<script>
    // カンマを除去して数値化する関数
    function getNumericValue(id, minVal = 0) {
        const input = document.getElementById(id);
        const rawValue = input.value.replace(/,/g, '');
        const parsed = parseInt(rawValue, 10);
        return Math.max(minVal, isNaN(parsed) ? minVal : parsed);
    }

    // 数値をカンマ区切りの文字列にする関数
    function formatWithCommas(num) {
        return num.toLocaleString();
    }

    function calculate() {
        // 数値の取得（入力中の生の値をパース）
        const marchCount = getNumericValue('marchCount', 1);
        const bearMarchCount = marchCount + 1;

        const shieldCount = getNumericValue('shieldCount', 0);
        const spearCount = getNumericValue('spearCount', 0);
        const archerCount = getNumericValue('archerCount', 0);
        
        const normalCapacity = getNumericValue('normalCapacity', 1);
        const bearCapacity = getNumericValue('bearCapacity', 1);

        // バッジとヒントテキストの動的更新
        document.getElementById('joyBadge').textContent = `${marchCount}行軍 / 優先: 盾→槍→弓`;
        document.getElementById('joyHint').textContent = `※ゲーム内で上記割合を${marchCount}行軍に一括設定してください。`;
        
        document.getElementById('bearBadge').textContent = `${bearMarchCount}行軍 / 優先: 弓→槍→盾`;
        document.getElementById('bearHint').textContent = `※自分の集結1枠＋参加${marchCount}枠のすべてにこの割合を設定してください。`;

        // --- クレイジージョイの計算 (優先度: 盾→槍→弓) ---
        let joyRemCap = normalCapacity;
        
        const joyShieldNeeded = Math.ceil(shieldCount / marchCount);
        const joyShieldPerMarch = Math.min(joyShieldNeeded, joyRemCap);
        joyRemCap -= joyShieldPerMarch;
        
        const joySpearNeeded = Math.ceil(spearCount / marchCount);
        const joySpearPerMarch = Math.min(joySpearNeeded, joyRemCap);
        joyRemCap -= joySpearPerMarch;
        
        const joyArcherPerMarch = joyRemCap;

        const joyShieldPct = Math.min(100, Math.ceil((joyShieldPerMarch / normalCapacity) * 100));
        const joySpearPct = Math.min(100 - joyShieldPct, Math.ceil((joySpearPerMarch / normalCapacity) * 100));
        const joyArcherPct = 100 - joyShieldPct - joySpearPct;

        document.getElementById('joyShieldPct').textContent = joyShieldPct + '%';
        document.getElementById('joySpearPct').textContent = joySpearPct + '%';
        document.getElementById('joyArcherPct').textContent = joyArcherPct + '%';


        // --- 熊罠の計算 (優先度: 弓→槍→盾) ---
        let bearRemCap = bearCapacity;
        
        const bearArcherNeeded = Math.ceil(archerCount / bearMarchCount);
        const bearArcherPerMarch = Math.min(bearArcherNeeded, bearRemCap);
        bearRemCap -= bearArcherPerMarch;
        
        const bearSpearNeeded = Math.ceil(spearCount / bearMarchCount);
        const bearSpearPerMarch = Math.min(bearSpearNeeded, bearRemCap);
        bearRemCap -= bearSpearPerMarch;
        
        const bearShieldPerMarch = bearRemCap;

        const bearArcherPct = Math.min(100, Math.ceil((bearArcherPerMarch / bearCapacity) * 100));
        const bearSpearPct = Math.min(100 - bearArcherPct, Math.ceil((bearSpearPerMarch / bearCapacity) * 100));
        const bearShieldPct = 100 - bearArcherPct - bearSpearPct;

        document.getElementById('bearShieldPct').textContent = bearShieldPct + '%';
        document.getElementById('bearSpearPct').textContent = bearShieldPct + '%'; // バグ防止のため修正確認
        document.getElementById('bearSpearPct').textContent = bearSpearPct + '%';
        document.getElementById('bearArcherPct').textContent = bearArcherPct + '%';
    }

    // イベントリスナーの一括設定
    document.querySelectorAll('input[data-type="int"]').forEach(input => {
        // フォーカスされたとき: カンマを消し、スマホ等で数値キーボードを出しやすくする（かつテキスト選択を全選択にする）
        input.addEventListener('focus', function() {
            const rawValue = this.value.replace(/,/g, '');
            this.value = rawValue;
            this.type = 'number'; // 一時的にnumberタイプにして数値キーボードを誘発
            setTimeout(() => this.select(), 10);
        });

        // 入力中: リアルタイム計算
        input.addEventListener('input', function() {
            calculate();
        });

        // フォーカスが外れたとき: カンマ区切りのテキストに戻す
        input.addEventListener('blur', function() {
            this.type = 'text'; // textタイプに戻す
            const minVal = this.id === 'shieldCount' || this.id === 'spearCount' || this.id === 'archerCount' ? 0 : 1;
            const num = getNumericValue(this.id, minVal);
            this.value = formatWithCommas(num);
        });
    });

    // 初期起動時に計算を実行
    window.onload = calculate;
</script>

</body>
</html>
