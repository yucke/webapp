<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteout Survival 兵士割合計算機</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --shield-color: #ef4444;
            --spear-color: #10b981;
            --archer-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        header p {
            font-size: 0.85rem;
            color: var(--muted-text);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title .mode-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 9999px;
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group.last {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 4px;
        }

        input[type="number"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-color);
            font-size: 1rem;
            font-weight: bold;
            text-align: right;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--border-color);
        }

        .result-row.shield { border-left-color: var(--shield-color); }
        .result-row.spear { border-left-color: var(--spear-color); }
        .result-row.archer { border-left-color: var(--archer-color); }

        .result-label {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .shield .result-value { color: var(--shield-color); }
        .spear .result-value { color: var(--spear-color); }
        .archer .result-value { color: var(--archer-color); }

        .hint-text {
            font-size: 0.75rem;
            color: var(--muted-text);
            margin-top: 12px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>兵士割合計算機</h1>
        <p>Whiteout Survival — クレイジージョイ & 熊罠</p>
    </header>

    <!-- 手持ち兵士数入力（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">手持ち兵士数</div>
        <div class="grid-3">
            <div class="form-group">
                <label for="shieldCount" style="color: var(--shield-color);">盾兵数</label>
                <input type="number" id="shieldCount" value="300000" min="0" oninput="calculate()">
            </div>
            <div class="form-group">
                <label for="spearCount" style="color: var(--spear-color);">槍兵数</label>
                <input type="number" id="spearCount" value="300000" min="0" oninput="calculate()">
            </div>
            <div class="form-group">
                <label for="archerCount" style="color: var(--archer-color);">弓兵数</label>
                <input type="number" id="archerCount" value="400000" min="0" oninput="calculate()">
            </div>
        </div>
    </div>

    <!-- 容量設定入力 -->
    <div class="card">
        <div class="card-title">出征容量設定</div>
        <div class="grid-2">
            <div class="form-group last">
                <label for="normalCapacity">通常出征容量 (ジョイ用)</label>
                <input type="number" id="normalCapacity" value="130000" min="1" oninput="calculate()">
            </div>
            <div class="form-group last">
                <label for="bearCapacity">熊出征容量 (専門家込)</label>
                <input type="number" id="bearCapacity" value="160000" min="1" oninput="calculate()">
            </div>
        </div>
    </div>

    <!-- クレイジージョイ結果（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">
            クレイジージョイ
            <span class="mode-badge">6行軍 / 優先: 盾→槍→弓</span>
        </div>
        <div class="result-row shield">
            <div class="result-label">盾兵割合</div>
            <div class="result-value" id="joyShieldPct">0%</div>
        </div>
        <div class="result-row spear">
            <div class="result-label">槍兵割合</div>
            <div class="result-value" id="joySpearPct">0%</div>
        </div>
        <div class="result-row archer">
            <div class="result-label">弓兵割合</div>
            <div class="result-value" id="joyArcherPct">0%</div>
        </div>
        <div class="hint-text">※容量を超過する場合、優先度の高い兵種から枠を埋めて停止します。</div>
    </div>

    <!-- 熊罠結果（盾→槍→弓） -->
    <div class="card">
        <div class="card-title">
            熊罠
            <span class="mode-badge">7行軍 / 優先: 弓→槍→盾</span>
        </div>
        <div class="result-row shield">
            <div class="result-label">盾兵割合</div>
            <div class="result-value" id="bearShieldPct">0%</div>
        </div>
        <div class="result-row spear">
            <div class="result-label">槍兵割合</div>
            <div class="result-value" id="bearSpearPct">0%</div>
        </div>
        <div class="result-row archer">
            <div class="result-label">弓兵割合</div>
            <div class="result-value" id="bearArcherPct">0%</div>
        </div>
        <div class="hint-text">※容量を超過する場合、優先度の高い兵種から枠を埋めて停止します。</div>
    </div>
</div>

<script>
    function calculate() {
        // 入力値の取得
        const shieldCount = Math.max(0, parseInt(document.getElementById('shieldCount').value) || 0);
        const spearCount = Math.max(0, parseInt(document.getElementById('spearCount').value) || 0);
        const archerCount = Math.max(0, parseInt(document.getElementById('archerCount').value) || 0);
        
        const normalCapacity = Math.max(1, parseInt(document.getElementById('normalCapacity').value) || 1);
        const bearCapacity = Math.max(1, parseInt(document.getElementById('bearCapacity').value) || 1);

        // --- クレイジージョイの計算 (6行軍 / 優先度: 盾→槍→弓) ---
        let joyRemCap = normalCapacity;
        
        // 1. 盾兵の割り当て
        const joyShieldNeeded = Math.ceil(shieldCount / 6);
        const joyShieldPerMarch = Math.min(joyShieldNeeded, joyRemCap);
        joyRemCap -= joyShieldPerMarch;
        
        // 2. 槍兵の割り当て
        const joySpearNeeded = Math.ceil(spearCount / 6);
        const joySpearPerMarch = Math.min(joySpearNeeded, joyRemCap);
        joyRemCap -= joySpearPerMarch;
        
        // 3. 弓兵の割り当て (残った容量すべて)
        const joyArcherPerMarch = joyRemCap;

        // 割合への変換 (優先度順に割合を確定させ、合計100%を超えないように制御)
        const joyShieldPct = Math.min(100, Math.ceil((joyShieldPerMarch / normalCapacity) * 100));
        const joySpearPct = Math.min(100 - joyShieldPct, Math.ceil((joySpearPerMarch / normalCapacity) * 100));
        const joyArcherPct = 100 - joyShieldPct - joySpearPct;

        // 画面反映 (ジョイ)
        document.getElementById('joyShieldPct').textContent = joyShieldPct + '%';
        document.getElementById('joySpearPct').textContent = joySpearPct + '%';
        document.getElementById('joyArcherPct').textContent = joyArcherPct + '%';


        // --- 熊罠の計算 (7行軍 / 優先度: 弓→槍→盾) ---
        let bearRemCap = bearCapacity;
        
        // 1. 弓兵の割り当て
        const bearArcherNeeded = Math.ceil(archerCount / 7);
        const bearArcherPerMarch = Math.min(bearArcherNeeded, bearRemCap);
        bearRemCap -= bearArcherPerMarch;
        
        // 2. 槍兵の割り当て
        const bearSpearNeeded = Math.ceil(spearCount / 7);
        const bearSpearPerMarch = Math.min(bearSpearNeeded, bearRemCap);
        bearRemCap -= bearSpearPerMarch;
        
        // 3. 盾兵の割り当て (残った容量すべて)
        const bearShieldPerMarch = bearRemCap;

        // 割合への変換 (優先度順: 弓→槍→盾 で割合を確定させ、合計100%を超えないように制御)
        const bearArcherPct = Math.min(100, Math.ceil((bearArcherPerMarch / bearCapacity) * 100));
        const bearSpearPct = Math.min(100 - bearArcherPct, Math.ceil((bearSpearPerMarch / bearCapacity) * 100));
        const bearShieldPct = 100 - bearArcherPct - bearSpearPct;

        // 画面反映 (熊罠) - 表示順は「盾→槍→弓」
        document.getElementById('bearShieldPct').textContent = bearShieldPct + '%';
        document.getElementById('bearSpearPct').textContent = bearSpearPct + '%';
        document.getElementById('bearArcherPct').textContent = bearArcherPct + '%';
    }

    // 初期起動時に計算を実行
    window.onload = calculate;
</script>

</body>
</html>
