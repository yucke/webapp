name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Embed HTML in Worker
        run: node scripts/embed-worker-url.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit HTML changes if modified
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add WOS_rally_tracker.html
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "Auto-update Worker URL in HTML"
            git push
          fi

      - name: Output deployment info
        run: |
          echo "✅ Worker deployed successfully!"
          echo "🌐 Access at: https://webapp.kiironoangel.workers.dev"
